<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作者 - 公視新聞 Demo E-2</title>
<style>
  :root{
    --page-bg:#f5f5f5;
    --blue:#007cff;
    --text:#151515;
    --muted:#9a9a9a;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--page-bg); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; color:var(--text); }
  a{ color:inherit; text-decoration:none; }
  .site-img{ width:100%; display:block; }
  .header-mobile, .footer-mobile{ display:none; }

  .content-wrap{
    display:flex; gap:32px;
    max-width:1300px; margin:0 auto;
    padding:36px 40px 60px;
  }
  .side-col{ width:180px; flex-shrink:0; align-self:flex-start; position:sticky; top:24px; }
  .sticky-left-img{ display:block; }
  .main-col{ flex:1; min-width:0; }

  .e-row-group{
    display:grid; grid-template-columns:repeat(3, 1fr); column-gap:88px;
    border-bottom:1px solid #ddd; padding-bottom:32px; margin-bottom:32px;
  }
  .e-row-group:nth-last-child(2){ border-bottom:none; padding-bottom:0; margin-bottom:0; }

  .e-col{ min-width:0; position:relative; padding:24px 0; }
  .e-col:not(:last-child)::after{ content:''; position:absolute; top:0; bottom:0; right:-44px; width:1px; background:#ddd; }

  .avatar{ width:69px; height:69px; border-radius:50%; position:relative; overflow:hidden; flex-shrink:0; box-shadow:0 0 0 3px var(--page-bg); }
  .eye-layer{ position:absolute; background-repeat:no-repeat; background-position:center; background-size:contain; transition:transform .12s ease-out; }
  .e-avatar-name{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; }
  .e-name{ font-size:24px; font-weight:700; }

  .e-primary{ margin-top:8px; display:flex; justify-content:center; gap:14px; flex-wrap:wrap; }
  .e-primary span{ color:var(--blue); font-weight:700; font-size:13px; white-space:nowrap; }

  .e-pills{ margin-top:8px; display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; }
  .pill{ display:inline-block; border:1px solid var(--blue); color:var(--blue); font-size:11px; padding:4px 10px; border-radius:14px; white-space:nowrap; }
  .pill-more{ color:var(--blue); font-size:16px; letter-spacing:1px; }

  .e-article{ padding:16px 0; border-bottom:1px solid #ddd; }
  .e-article:first-child{ padding-top:20px; }
  .e-article:nth-last-child(2){ border-bottom:none; }
  .e-article-title{ font-size:15px; font-weight:400; line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .e-article-time{ margin-top:8px; font-size:12px; color:var(--muted); }

  .e-more-btn{ margin-top:16px; display:block; text-align:center; background:transparent; border:1px solid var(--blue); color:var(--blue); font-size:14px; font-weight:600; padding:12px; border-radius:0; cursor:default; user-select:none; }

  .more-btn{ margin-top:20px; background:var(--blue); color:#fff; text-align:center; padding:16px; border-radius:0; font-weight:600; font-size:15px; cursor:default; user-select:none; }

  /* ---- 手機版隨機眼睛動態（無限 ping-pong，數值依 Figma safety-L / safety-R 安全範圍換算，4 選 1） ----
     安全範圍換算到本頁 69px 頭像後：水平 ±15.7px／向上最多 -12.8px／向下最多 +18.4px
     百分比與緩動節點皆直接沿用 Figma 原始 keyframe 結構 */
  @keyframes eyeMotion1{
    0%{ transform:translate(15.7px, 0px); }
    20.049%{ transform:translate(15.7px, 0px); animation-timing-function:ease-in-out; }
    79.947%{ transform:translate(-15.7px, 0px); }
    100%{ transform:translate(-15.7px, 0px); }
  }
  @keyframes eyeMotion2{
    0%{ transform:translate(-12.8px, -7.9px); }
    20.049%{ transform:translate(-12.8px, -7.9px); animation-timing-function:ease-in-out; }
    79.993%{ transform:translate(12.8px, -7.9px); }
    100%{ transform:translate(12.8px, -7.9px); }
  }
  @keyframes eyeMotion3{
    0%{ transform:translate(0px, 0px) scaleY(1); }
    20.049%{ transform:translate(0px, 0px) scaleY(1); animation-timing-function:cubic-bezier(.5,0,.5,1); }
    22.499%{ transform:translate(0px, 0px) scaleY(0); animation-timing-function:cubic-bezier(.5,0,.5,1); }
    25.149%{ transform:translate(0px, 0px) scaleY(1); }
    39.999%{ transform:translate(0px, 0px) scaleY(1); }
    49.898%{ transform:translate(0px, 15.4px) scaleY(1); }
    59.948%{ transform:translate(0px, 0px) scaleY(1); }
    69.997%{ transform:translate(0px, 15.4px) scaleY(1); }
    79.997%{ transform:translate(0px, 0px) scaleY(1); }
    100%{ transform:translate(0px, 0px) scaleY(1); }
  }
  @keyframes eyeMotion4{
    0%{ transform:scaleY(1); }
    25.149%{ transform:scaleY(1); animation-timing-function:cubic-bezier(.5,0,.5,1); }
    30.146%{ transform:scaleY(0); animation-timing-function:cubic-bezier(.5,0,.5,1); }
    35.165%{ transform:scaleY(1); }
    65.031%{ transform:scaleY(1); animation-timing-function:cubic-bezier(.5,0,.5,1); }
    70.028%{ transform:scaleY(0); animation-timing-function:cubic-bezier(.5,0,.5,1); }
    75.047%{ transform:scaleY(1); }
    100%{ transform:scaleY(1); }
  }
  @media (max-width: 900px){
    .eye-layer.motion-1{ animation:eyeMotion1 2.000073s linear infinite alternate; }
    .eye-layer.motion-2{ animation:eyeMotion2 2.000073s linear infinite alternate; }
    .eye-layer.motion-3{ animation:eyeMotion3 2.000073s linear infinite alternate; }
    .eye-layer.motion-4{ animation:eyeMotion4 2.000073s linear infinite alternate; }
  }

  @media (max-width: 900px){
    .content-wrap{ flex-direction:column; gap:0; padding:24px 20px 40px; }
    .side-col{ width:auto; position:static; margin-bottom:20px; }
    .e-row-group{ grid-template-columns:1fr; column-gap:0; border-bottom:none; padding-bottom:0; margin-bottom:0; }
    .e-col::after{ display:none; }
    .e-col{ border-bottom:1px solid #ddd; padding-bottom:24px; margin-bottom:24px; }
    .e-row-group:nth-last-child(2) .e-col:last-child{ border-bottom:none; padding-bottom:0; margin-bottom:0; }
  }

  @media (max-width: 720px){
    .header-desktop, .footer-desktop{ display:none; }
    .header-mobile, .footer-mobile{ display:block; }
  }
</style>
</head>

// ---- 每位作者隨機分配 1 個眼睛動態（1~4），避開左邊與正上方相鄰的作者重複 ----
const COLS = 3;
const motionAssignments = [];
for (let i = 0; i < AUTHORS.length; i++){
  const forbidden = new Set();
  if (i % COLS !== 0) forbidden.add(motionAssignments[i - 1]);        // 左邊相鄰
  if (i >= COLS) forbidden.add(motionAssignments[i - COLS]);          // 正上方相鄰
  const options = [1, 2, 3, 4].filter(m => !forbidden.has(m));
  motionAssignments.push(options[Math.floor(Math.random() * options.length)]);
}

}

// ---- 眼睛互動：桌機版沿用滑鼠追蹤設定；手機版（螢幕寬度 <=900px）改用隨機 ping-pong 動態 ----
const maxOffset = 14;
const mobileQuery = window.matchMedia('(max-width: 900px)');

function isMobileWidth(){
  return mobileQuery.matches;
}

function clearInlineEyeTransforms(){
  document.querySelectorAll('.eye-layer').forEach(el => { el.style.transform = ''; });
}

function updateEyes(clientX, clientY) {
  if (isMobileWidth()) return; // 手機寬度交給 CSS @keyframes 動態處理
  document.querySelectorAll('.eye-layer').forEach(el => {
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = clientX - cx;
    const dy = clientY - cy;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const offX = (dx / dist) * Math.min(maxOffset, dist / 6);
    const offY = (dy / dist) * Math.min(maxOffset, dist / 6);
    el.style.transform = `translate(${offX}px, ${offY}px)`;
  });
}

// 切換到手機寬度時，清掉桌機殘留的 inline transform，讓 CSS 動態能正常接管
if (isMobileWidth()) clearInlineEyeTransforms();
mobileQuery.addEventListener('change', (e) => {
  if (e.matches) clearInlineEyeTransforms();
});

window.addEventListener('mousemove', (e) => updateEyes(e.clientX, e.clientY));
