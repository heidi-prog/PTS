<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作者 - 公視新聞 Demo B</title>
<style>
  :root{
    --page-bg:#f5f5f5;
    --card-bg:#e5e5e5;
    --blue:#007cff;
    --text:#151515;
    --muted:#9a9a9a;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--page-bg); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; color:var(--text); }
  .site-img{ width:100%; display:block; }
  .header-mobile, .footer-mobile{ display:none; }

  .crumb{ max-width:1300px; margin:0 auto; padding:34px 40px 0; font-size:14px; color:var(--muted); }
  .crumb .cur{ color:var(--text); }

  /* ---- pinned scroll-jack section ---- */
  .pin-outer{ position:relative; }
  .pin-inner{
    position:sticky;
    top:20px;
    height:820px;
    max-width:1300px;
    margin:0 auto;
    padding:26px 40px 0;
    overflow:hidden;
  }
  .panel{
    position:absolute;
    top:26px; left:40px; right:40px; bottom:0;
    display:flex;
    gap:32px;
    align-items:flex-start;
  }

  /* left column: name list */
  .name-col{ width:280px; flex-shrink:0; }
  .name-item{
    padding:21px 0;
    font-size:16px;
    color:var(--muted);
    cursor:pointer;
    user-select:none;
    transition:color .15s ease;
    white-space:nowrap;
  }
  .name-item:hover{ color:#666; }
  .divider{ border-top:1px solid #ddd; margin:4px 0; }
  .selected-panel{ padding:18px 0; }
  .selected-panel .avatar-row{ display:flex; align-items:center; gap:18px; margin-bottom:18px; }
  .avatar{ width:69px; height:69px; border-radius:50%; position:relative; overflow:hidden; flex-shrink:0; box-shadow:0 0 0 3px var(--page-bg); }
  .eye-layer{ position:absolute; background-repeat:no-repeat; background-position:center; background-size:contain; transition:transform .05s ease-out; }
  .sel-name{ font-size:26px; font-weight:700; }
  .primary-tags{ margin-top:2px; }
  .primary-tags span{ color:var(--blue); font-weight:700; font-size:14px; margin-right:14px; white-space:nowrap; }
  .pill-row{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; }
  .pill{ display:inline-block; border:1px solid var(--blue); color:var(--blue); font-size:12px; padding:4px 12px; border-radius:14px; white-space:nowrap; }

  /* right column: article grid */
  .grid-col{ flex:1; min-width:0; display:flex; flex-direction:column; height:100%; }
  .article-rows{ overflow:hidden; flex:1; }
  .article-row{ display:flex; gap:24px; margin-bottom:24px; position:relative; }
  .article-card{ flex:0 0 auto; width:calc((100% - 48px) / 2.55); }
  .article-img{ width:100%; aspect-ratio:288/193; border-radius:0; background-size:cover; background-position:center; background-color:#ddd; }

  .article-tags{ margin-top:12px; font-size:12px; color:var(--muted); }
  .article-tags span{ margin-right:10px; }
  .article-title{ margin-top:6px; font-size:16px; font-weight:700; line-height:1.4; color:var(--text); }
  .article-time{ margin-top:10px; font-size:12px; color:var(--muted); }

  .mobile-fallback .sel-name{ font-size:22px; }

  .mobile-fallback .article-row{ gap:16px; }

  @media (max-width: 720px){
    .header-desktop, .footer-desktop{ display:none; }

const N = AUTHORS.length;
const STEP_PX = 480; // scroll distance per author transition
const CONTENT_H = 820;
const STICKY_TOP = 20;

function avatarHTML(type){
  return `<div class="avatar" style="background:${type.bg}">
    <div class="eye-layer" style="left:${type.left}%; top:${type.top}%; width:${EYE_W}%; height:${EYE_H}%; background-image:url('${type.eye}')"></div>
  </div>`;
}

function nameListHTML(idx, onFallback){
  // 4 above, 4 below, wrapping circularly
  const above = [];
  for(let k=4;k>=1;k--) above.push((idx-k+N)%N);
  const below = [];
  for(let k=1;k<=4;k++) below.push((idx+k)%N);
  const author = AUTHORS[idx];
  const type = avatarTypes[author.avatarType];

  const itemsAbove = above.map(i => `<div class="name-item" data-idx="${i}">${AUTHORS[i].name}</div>`).join('');
  const itemsBelow = below.map(i => `<div class="name-item" data-idx="${i}">${AUTHORS[i].name}</div>`).join('');

  const primaryHTML = author.primary.length
    ? `<div class="primary-tags">${author.primary.map(t=>`<span># ${t}</span>`).join('')}</div>`
    : '';
  const pillsHTML = author.pills.map(row =>
    `<div class="pill-row">${row.map(t=>`<span class="pill">${t}</span>`).join('')}</div>`
  ).join('');

  return `
    ${itemsAbove}
    <div class="divider"></div>
    <div class="selected-panel">
      <div class="avatar-row">
        ${avatarHTML(type)}
        <div class="sel-name">${author.name}</div>
      </div>
      ${primaryHTML}
      ${pillsHTML}
    </div>
    <div class="divider"></div>
    ${itemsBelow}
  `;
}

function articleGridHTML(idx){
  const author = AUTHORS[idx];
  const arts = author.articles;
  const nextArts = AUTHORS[(idx+1)%N].articles;
  function card(a){
    return `<div class="article-card">
      <div class="article-img" style="background-image:url('${ARTICLE_IMAGES[a.img]}')"></div>
      <div class="article-tags">${a.tags.map(t=>`<span>${t}</span>`).join('')}</div>
      <div class="article-title">${a.title}</div>
      <div class="article-time">${a.time}</div>
    </div>`;
  }
  function fadeCard(peekImg){
    return `<div class="article-card">
      <div class="article-img" style="background-image:url('${ARTICLE_IMAGES[peekImg]}')"></div>
    </div>`;
  }
  return `
    <div class="article-rows">
      <div class="article-row">${card(arts[0])}${card(arts[1])}${fadeCard(nextArts[0].img)}<div class="row-fade-mask"></div></div>
      <div class="article-row">${card(arts[2])}${card(arts[3])}${fadeCard(nextArts[2].img)}<div class="row-fade-mask"></div></div>
    </div>
    <div class="more-btn">更多文章 &rarr;</div>
  `;
}

function panelHTML(idx){
  return `
    <div class="name-col">${nameListHTML(idx)}</div>
    <div class="grid-col">${articleGridHTML(idx)}</div>
  `;
}

// ---- mobile fallback: simple stacked sections, one per author ----
function mobileBlockHTML(idx){
  const author = AUTHORS[idx];
  const type = avatarTypes[author.avatarType];
  const primaryHTML = author.primary.length
    ? `<div class="primary-tags">${author.primary.map(t=>`<span># ${t}</span>`).join('')}</div>`
    : '';
  const pillsHTML = author.pills.map(row =>
    `<div class="pill-row">${row.map(t=>`<span class="pill">${t}</span>`).join('')}</div>`
  ).join('');
  const arts = author.articles;
  function card(a){
    return `<div class="article-card">
      <div class="article-img" style="background-image:url('${ARTICLE_IMAGES[a.img]}')"></div>
      <div class="article-tags">${a.tags.map(t=>`<span>${t}</span>`).join('')}</div>
      <div class="article-title">${a.title}</div>
      <div class="article-time">${a.time}</div>
    </div>`;
  }
  return `
    <div class="m-block">
      <div class="m-avatar-row avatar-row">
        ${avatarHTML(type)}
        <div class="sel-name">${author.name}</div>
      </div>
      ${primaryHTML}
      ${pillsHTML}
      <div class="article-row" style="margin-top:20px;flex-wrap:wrap;">${card(arts[0])}${card(arts[1])}</div>
      <div class="article-row" style="flex-wrap:wrap;">${card(arts[2])}${card(arts[3])}</div>
      <div class="more-btn">更多文章 &rarr;</div>
    </div>
  `;
}
document.getElementById('mobileFallback').innerHTML = AUTHORS.map((_, i) => mobileBlockHTML(i)).join('');

const panelA = document.getElementById('panelA');
const panelB = document.getElementById('panelB');
let renderedA = -1, renderedB = -1;

function ensureRendered(el, idx, cache){
  if(cache.idx !== idx){
    el.innerHTML = panelHTML(idx);
    cache.idx = idx;
  }
}
const cacheA = {idx:-1}, cacheB = {idx:-1};

const pinOuterEl = document.getElementById('pinOuter');
pinOuterEl.style.height = (CONTENT_H + (N - 1) * STEP_PX) + 'px';

function update(){
  const outer = document.getElementById('pinOuter');
  const rect = outer.getBoundingClientRect();
  const scrollableRange = outer.offsetHeight - CONTENT_H;
  let scrolled = (STICKY_TOP - rect.top);
  let progress = scrollableRange > 0 ? scrolled / scrollableRange : 0;
  progress = Math.max(0, Math.min(1, progress));
  const virtual = progress * (N - 1);
  let idx = Math.floor(virtual);
  if(idx >= N-1){ idx = N-2; }
  if(idx < 0) idx = 0;
  const rawFrac = virtual - idx;

  // Keep each state fully readable ("dwell") for most of the step, and only
  // crossfade quickly in the last portion of the scroll distance -> crisp,
  // short transition instead of a long blurry overlap.
  const ZONE = 0.22; // fraction of each step's scroll distance used for the actual fade
  let t = (rawFrac - (1 - ZONE)) / ZONE;
  t = Math.max(0, Math.min(1, t));
  t = t * t * (3 - 2 * t); // smoothstep easing for a crisp, non-linear fade

  ensureRendered(panelA, idx, cacheA);
  ensureRendered(panelB, idx+1, cacheB);
  panelA.style.opacity = 1 - t;
  panelB.style.opacity = t;
  panelA.style.zIndex = t < 0.5 ? 2 : 1;
  panelB.style.zIndex = t < 0.5 ? 1 : 2;
}

document.addEventListener('scroll', update, {passive:true});
window.addEventListener('resize', update);

// click-to-jump on name items (delegated, since panels re-render)
document.addEventListener('click', (e) => {
  const item = e.target.closest('.name-item');
  if(!item) return;
  const targetIdx = parseInt(item.dataset.idx, 10);
  const outer = document.getElementById('pinOuter');
  const scrollableRange = outer.offsetHeight - CONTENT_H;
  const outerTop = outer.getBoundingClientRect().top + window.scrollY;
  const targetProgress = targetIdx / (N - 1);
  const targetScrollY = outerTop - STICKY_TOP + targetProgress * scrollableRange + 1;
  window.scrollTo({ top: targetScrollY, behavior: 'smooth' });
});

update();

// ---- eye tracking (desktop mouse / mobile scroll direction), reused from Version A ----
const maxOffset = 14;
function updateEyes(clientX, clientY){
  document.querySelectorAll('.eye-layer').forEach(el => {
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    const dx = clientX - cx, dy = clientY - cy;
    const dist = Math.sqrt(dx*dx+dy*dy) || 1;
    const offX = (dx/dist) * Math.min(maxOffset, dist/6);
    const offY = (dy/dist) * Math.min(maxOffset, dist/6);
    el.style.transform = `translate(${offX}px, ${offY}px)`;
  });
}
function setEyesOffsetY(offsetY){
  document.querySelectorAll('.eye-layer').forEach(el => {
    el.style.transform = `translate(0px, ${offsetY}px)`;
  });
}
const isTouchPrimary = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
if(!isTouchPrimary){
  document.addEventListener('mousemove', (e) => updateEyes(e.clientX, e.clientY));
} else {
  let lastScrollY = window.scrollY;
  let resetTimer = null;
  document.addEventListener('scroll', () => {
    const currentY = window.scrollY;
    const delta = currentY - lastScrollY;
    lastScrollY = currentY;
    const direction = delta > 0 ? 1 : (delta < 0 ? -1 : 0);
    const magnitude = Math.min(maxOffset, 8 + Math.abs(delta)*1.2);
    setEyesOffsetY(direction * magnitude);
    if(resetTimer) clearTimeout(resetTimer);
    resetTimer = setTimeout(() => setEyesOffsetY(0), 250);
  }, {passive:true});
}
